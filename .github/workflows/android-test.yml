# Nur zum Testen auf dem Branch native-app: baut die Android-App, ohne etwas zu veröffentlichen.
name: Android-App testen
on:
  push:
    branches: [native-app]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - name: Web-Teil für die App bauen
        env:
          VITE_NATIVE: '1'
          VITE_BASE: /
          VITE_SUPABASE_URL: https://rvdyegobwsupgvdwtczi.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ vars.TEST_ANON_KEY }}
        run: |
          npx vite build
          npx cap sync android
      - name: APK bauen (Test-Signatur)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hunt-mode-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
