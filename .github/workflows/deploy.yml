# Baut die App und stellt sie auf GitHub Pages. Richtet vorher Supabase automatisch ein
# (Projekt, Datenbank, Anmeldung). Braucht nur das Secret SUPABASE_ACCESS_TOKEN.
name: App veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Alle 3 Tage: hält das kostenlose Supabase-Projekt wach (pausiert sonst nach 7 Tagen).
    - cron: '17 5 */3 * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      supabase_url: ${{ steps.supabase.outputs.url }}
      supabase_key: ${{ steps.supabase.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Supabase einrichten
        id: supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          export SITE_URL="https://${OWNER,,}.github.io/${REPO}/"
          node scripts/supabase-setup.mjs
      - name: App bauen
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          VITE_SUPABASE_ANON_KEY: ${{ steps.supabase.outputs.key }}
        run: |
          npm run build
          # Direktaufrufe wie /gruppe/abc landen ebenfalls in der App.
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Echte Android-App (APK) mit Standort im Hintergrund. Download: Releases > "Android-App".
  android:
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Web-Teil für die App bauen
        env:
          VITE_NATIVE: '1'
          VITE_BASE: /
          VITE_SUPABASE_URL: ${{ needs.build.outputs.supabase_url }}
          VITE_SUPABASE_ANON_KEY: ${{ needs.build.outputs.supabase_key }}
        run: |
          npx vite build
          npx cap sync android
      - name: Signatur-Schlüssel
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hunt-mode.p12"
            echo "HM_KEYSTORE_FILE=$RUNNER_TEMP/hunt-mode.p12" >> "$GITHUB_ENV"
            echo "HM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "HM_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Signatur-Schlüssel hinterlegt: es wird eine Test-Version gebaut (Updates brauchen dann eine Neuinstallation)."
          fi
      - name: APK bauen
        env:
          HM_VERSION_CODE: ${{ github.run_number }}
          HM_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$HM_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../hunt-mode.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../hunt-mode.apk
          fi
      - name: Als Download bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-app >/dev/null 2>&1 || gh release create android-app --title "Android-App" --notes "Hunt Mode für Android. Auf dem Handy herunterladen und installieren (einmal „Installation aus unbekannten Quellen“ erlauben). Neuere Versionen einfach über die alte installieren." --latest
          gh release upload android-app hunt-mode.apk --clobber
          gh release edit android-app --notes "Hunt Mode für Android, Version 1.0.${{ github.run_number }} ($(date -u +%Y-%m-%d)). Auf dem Handy herunterladen und installieren (einmal „Installation aus unbekannten Quellen“ erlauben). Neuere Versionen einfach über die alte installieren."

